[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.7.6"
evm_version = "istanbul"
optimizer = true
optimizer_runs = 800
via_ir = false
bytecode_hash = "none"

[rpc_endpoints]
supra_evm_devnet = "${SUPRA_EVM_RPC_URL}"
supra_evm_testnet = "${SUPRA_EVM_TESTNET_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
